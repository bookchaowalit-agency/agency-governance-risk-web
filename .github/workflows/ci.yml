name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Node CI: npm ci, lint, typecheck, Vitest with a line-coverage gate, then `npm run check`
  # (typecheck + static export to out/ with the bundled Thai fonts). Fails closed.
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      require-tests: true
      coverage-threshold: "79"
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run check

  # Shared security scan: gitleaks, Semgrep, OSV-Scanner, Trivy.
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  # ADR-0007 design floor (12 rules, 5 widths) on the static export in out/.
  design-floor:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/design-floor.yml@65c8187edae6dd7f432f9ac694277b9da7231230 # v1.4.1
    with:
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build
